[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goal-api"
version = "1.0.0"
description = "Python SDK for the GOAL API: football fixtures, live scores, standings, stats and live WebSocket updates."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "GOAL API", email = "support@goal-api.com" }]
keywords = ["goal-api", "football", "soccer", "live-scores", "fixtures", "standings", "sports-data", "api-client", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
live = ["websockets>=12"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "websockets>=12"]

[project.urls]
Homepage = "https://goal-api.com"
Documentation = "https://goal-api.com/documentation"
Source = "https://github.com/Devara-sarl/goal-api-python"
Issues = "https://github.com/Devara-sarl/goal-api-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["goal_api"]

[tool.hatch.build.targets.wheel.force-include]
"goal_api/py.typed" = "goal_api/py.typed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
