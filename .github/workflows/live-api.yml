name: live-api

# Hits the real API. Needs a GOAL_API_KEY secret on the `live-api` environment; the
# tests skip without it.
on:
  schedule:
    - cron: '22 6 * * *'
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    environment: live-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - env:
          GOAL_API_KEY: ${{ secrets.GOAL_API_KEY }}
        run: pytest -q
